name: Documentation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    outputs:
      example-revisions: ${{ steps.sources.outputs.revisions }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.x'
          cache: npm
      - run: npm ci
      - name: Read documentation example revisions
        id: sources
        run: echo "revisions=$(node scripts/check-examples.mjs --revisions)" >> "$GITHUB_OUTPUT"
      - run: npm run lint
      - run: npm run types:check
      - run: npm run check:docs
      - name: List Go and XGo excerpts for technical review
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo '### Go and XGo excerpts outside the example runner' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check the affected excerpts on these changed pages against the pinned implementation or a separate reproduction.' >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" HEAD -- ':(glob)content/docs/**/*.md' ':(glob)content/docs/**/*.mdx' |
            xargs -0 -r node scripts/check-examples.mjs --review-files >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.x'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload website coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  examples:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(needs.validate.outputs.example-revisions) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.x'
          cache: npm
      - run: npm ci
      - name: Check out the documented XGo revision
        uses: actions/checkout@v7.0.1
        with:
          repository: goplus/xgo
          ref: ${{ matrix.revision }}
          path: .ci/xgo
          persist-credentials: false
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: .ci/xgo/cmd/go.mod
          cache-dependency-path: |
            .ci/xgo/go.sum
            .ci/xgo/cmd/go.sum
      - name: Build the documented XGo compiler
        working-directory: .ci/xgo/cmd
        run: go build -o "$RUNNER_TEMP/xgo-doc-bin/xgo" ./xgo
      - run: npm run check:examples
        env:
          XGOROOT: ${{ github.workspace }}/.ci/xgo
          XGO_BIN: ${{ runner.temp }}/xgo-doc-bin/xgo
          XGO_SOURCE_COMMIT: ${{ matrix.revision }}
